name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

jobs:
  classify-production-ci:
    name: classify production CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/classify_production_ci.py --event-path "$GITHUB_EVENT_PATH"

  lint:
    needs: classify-production-ci
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: needs.classify-production-ci.outputs.run_full == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Check types
        run: ./scripts/lint

      - name: Validate release gate policy
        run: |
          python3 .github/scripts/test_release_pr_auto_merge.py -v
          python3 .github/scripts/test_release_pr_ci_gate.py -v
          python3 .github/scripts/test_classify_production_ci.py -v
          python3 .github/scripts/test_validate_next_provenance.py -v
          python3 .github/scripts/test_verify_npm_release.py -v

  test:
    needs: classify-production-ci
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    if: needs.classify-production-ci.outputs.run_full == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run complete Jest suite
        run: ./scripts/test

  build:
    needs: classify-production-ci
    timeout-minutes: 5
    name: build
    runs-on: ubuntu-latest
    if: needs.classify-production-ci.outputs.run_full == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Check build
        run: ./scripts/build

      - name: Check package imports without optional dependencies
        run: ./scripts/test-package-imports

      - name: Check MCP Deno execute
        env:
          MCP_SERVER_PATH: ${{ github.workspace }}/packages/mcp-server/dist/index.js
        run: pnpm --dir packages/mcp-server test:deno-execute
