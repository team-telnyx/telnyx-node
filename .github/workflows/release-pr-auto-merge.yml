name: Exact-head release PR auto-merge

on:
  pull_request:
    branches: [master]
    paths:
      - .github/scripts/release_pr_auto_merge.py
      - .github/scripts/test_release_pr_auto_merge.py
      - .github/workflows/release-pr-auto-merge.yml
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Release Please PR number
        required: true
        type: number
      dry_run:
        description: Attest without merging
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-pr-auto-merge-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run policy tests
        run: python3 .github/scripts/test_release_pr_auto_merge.py -v
      - name: Compile policy
        run: python3 -m py_compile .github/scripts/release_pr_auto_merge.py .github/scripts/test_release_pr_auto_merge.py

  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.state == 'open' &&
        startsWith(github.event.pull_request.head.ref, 'release-please--') &&
        startsWith(github.event.pull_request.title, 'release: ') &&
        (github.event.action != 'labeled' || github.event.label.name == 'autorelease: pending')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      # pull_request_target's github.sha is the trusted base/default commit. Never
      # checkout the PR head in this privileged job.
      - name: Check out trusted default-branch policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Attest exact head and merge normally
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            EXPECTED_HEAD=""
            DRY_RUN="$INPUT_DRY_RUN"
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            EXPECTED_HEAD="$EVENT_HEAD_SHA"
            DRY_RUN="false"
          fi

          args=(--pr-number "$PR_NUMBER")
          if [ -n "$EXPECTED_HEAD" ]; then
            args+=(--expected-head "$EXPECTED_HEAD")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/release_pr_auto_merge.py "${args[@]}"
